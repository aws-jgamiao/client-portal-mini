name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public placeholders so the env schema validates; no secrets are needed.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  database-and-e2e:
    name: RLS, integration and E2E tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Start local Supabase (Docker)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,mailpit

      - name: Write .env.local from the local stack
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
            echo "NEXT_PUBLIC_DEMO_MODE=true"
          } > .env.local

      - run: npm run db:seed-storage
      - name: Database policy tests (pgTAP)
        run: npm run test:db
      - name: API integration tests
        run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
